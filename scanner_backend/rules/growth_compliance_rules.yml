version: "2026-07-v1"
blocked_phrases:
  - "guaranteed score increase"
  - "guaranteed approval"
  - "remove all negatives"
  - "delete collections"
  - "fix credit fast"
  - "lawsuit threat"
  - "attorney will sue"
  - "no risk"
  - "instant results"
safe_phrases:
  - "possible score improvement"
  - "credit readiness"
  - "review recommended"
  - "results vary"
  - "accurate, current, and verifiable information may remain"
  - "possible report errors"
  - "customer approval required"
  - "admin review required"
guardrails:
  - "AI recommends."
  - "Founder approves."
  - "Compliance is logged."
  - "No automatic public posting."
  - "No automatic customer outreach unless approved."
  - "No automatic dispute letters."
  - "No automatic complaint packets."
  - "No legal escalation automation."
  - "No credit score guarantees."
  - "No loan, rent, mortgage, auto, apartment, insurance, or job approval guarantees."
  - "No legal advice."
attorney_wording: "Attorney support may be available for eligible unresolved credit-reporting issues."
